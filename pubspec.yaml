name: chop_chop_quiz
description: Chớp Chớp Quiz - game đố vui nhanh, dễ thương.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_mobile_ads: ^9.2.0
  games_services: ^5.3.0
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/questions.json
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_1024_square.png"
  adaptive_icon_background: "#FFF6E5"
  adaptive_icon_foreground: "assets/icon/app_icon_1024_square.png"
  adaptive_icon_foreground_inset: 12
  remove_alpha_ios: true
